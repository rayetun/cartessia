name: Update WordPress.org assets & readme

# Pushes the plugin icon, banner, screenshots and readme.txt to the live
# WordPress.org listing WITHOUT needing a full release — runs whenever those
# files change on the default branch (or on a manual trigger). Assets live in
# the .wordpress-org/ directory.

on:
  push:
    branches: [main]
    paths:
      - '.wordpress-org/**'
      - 'readme.txt'
      - '.github/workflows/assets.yml'
  workflow_dispatch:

jobs:
  assets:
    name: Update assets & readme on trunk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update plugin assets & readme
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: cartessia
          ASSETS_DIR: .wordpress-org
